[package]
name = "rust_world"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "rust_world"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["extension-module"] }
numpy = "0.29.0"
rand = "0.9"
rand_pcg = "0.9"
rand_distr = "0.5"
rayon = "1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
